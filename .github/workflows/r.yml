# R CMD check for the mfbdfm package, based on the maintained
# r-lib/actions workflows:
# https://github.com/r-lib/actions/tree/v2-branch/examples

name: R-CMD-check

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'analysis/**'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'analysis/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    # R-devel needs far longer than the release jobs, and not because of anything
    # this package does: Posit's binary repo publishes no builds for R-devel, so
    # every dependency compiles from source. Measured on the first run, with a
    # cold cache: ~27 of 30 minutes went to building dependencies (pec,
    # pammtools, TTR, quantmod, tseries, rcmdcheck), the check itself had barely
    # started, and the job was cancelled at the 30-minute ceiling. Later runs hit
    # the dependency cache and are much quicker, but the first one has to be able
    # to finish in order to populate it.
    timeout-minutes: ${{ matrix.config.r == 'devel' && 75 || 30 }}
    # The R-devel job is advisory: R-devel breaks for upstream reasons that have
    # nothing to do with this package, and a red main on that basis trains people
    # to ignore CI. Read its result, don't gate on it.
    #
    # Note that this alone is not enough, which is why the timeout above is
    # generous rather than merely adequate: continue-on-error masks a job that
    # *fails*, but a job killed by timeout-minutes is *cancelled*, and a cancelled
    # job still takes the whole run's conclusion to "cancelled". Keeping devel
    # from being cancelled is what actually keeps the run green.
    continue-on-error: ${{ matrix.config.r == 'devel' }}

    strategy:
      fail-fast: false
      matrix:
        config:
          # Package requires R >= 4.1 (DESCRIPTION); test the current and
          # previous release on Linux, plus one macOS and one Windows job
          # (r-pkgs.org's check-standard matrix).
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          # CRAN checks against R-devel, so we do too. Added for the 0.1.0
          # release (#25): every other job here is release or oldrel, which left
          # "no R-devel result" as the standing gap before a CRAN submission.
          # http-user-agent is the r-lib/actions convention for devel - RSPM
          # serves source-only packages to a devel user agent, which slows the
          # job down enormously without it.
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      # Installs Imports + Suggests (with system dependencies on Ubuntu)
      # and caches the package library between runs.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual")'
          error-on: '"warning"'
          upload-snapshots: true
