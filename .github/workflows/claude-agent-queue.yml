name: Claude Agent Queue

# Works the issue queue unattended, one issue per run.
#
# Queue state lives entirely in GitHub labels, because a runner keeps nothing
# between runs -- every run starts with zero context and rebuilds it from the
# repository and the issue:
#
#   agent-ready    you queued it; the agent may pick it up
#   agent-working  claimed by a run in flight (a stale claim is reclaimable)
#   agent-done     a pull request is open for it
#   agent-blocked  the agent stopped and wants a human
#
# Two triggers, covering each other's gap: `labeled` starts a run the moment you
# queue something, and the cron drains whatever is left -- which is also the only
# retry mechanism there is. A run killed midway (usually by exhausting the
# subscription quota) leaves its `agent-working` claim behind; the next cron fire
# reclaims it once the quota window has reset.

on:
  issues:
    types: [labeled]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number to work (optional; otherwise takes the next queued one)"
        required: false
        type: string

# One agent at a time. `cancel-in-progress: false` matters: a scheduled fire must
# not kill a run already working an issue. GitHub keeps at most one *pending* run
# per group, so fires that arrive during a long run collapse into a single
# follow-up rather than piling up.
concurrency:
  group: claude-agent-queue
  cancel-in-progress: false

jobs:
  agent:
    # On a `labeled` event only the queue label starts a run. Cron and manual
    # dispatch carry no label at all, so they fall through to the queue lookup.
    if: github.event_name != 'issues' || github.event.label.name == 'agent-ready'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write        # push the issue branch
      issues: write          # move labels, comment results
      pull-requests: write   # open the PR
      id-token: write        # required for the action's GitHub App auth
      actions: read          # let the agent read CI results
      # Lets the agent push files under .github/workflows/. Without it a push
      # touching one is refused outright ("refusing to allow a GitHub App to
      # create or update workflow ... without `workflows` permission"), which
      # is what blocked #78. Granted knowingly: it also lets the agent modify
      # THIS file -- its own permissions, model, cron, tools and prompt. Review
      # any agent PR touching claude-agent-queue.yml as a permissions change,
      # not as configuration.
      workflows: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0     # full history: the agent inspects it for conventions

      # R, pandoc and the package dependencies are installed here rather than by
      # the agent itself. The cached r-lib actions do it in a couple of minutes
      # and cost no model turns, where an agent shelling out to install them
      # would burn both. pandoc is not optional: without it `R CMD build` fails
      # outright on vignette rebuilding, and the check picks up two spurious
      # NOTEs that look like package defects (see CLAUDE.md).
      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::devtools, any::roxygen2
          needs: check

      - uses: anthropics/claude-code-action@v1
        with:
          # Authenticates against the Claude subscription rather than a metered
          # API key. Generate with `claude setup-token` and store as a secret.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # `github_token` is deliberately NOT set here. Left unset, the action
          # authenticates as the Claude GitHub App, and GitHub fires r.yml on the
          # pull requests it opens. Passing `secrets.GITHUB_TOKEN` instead would
          # silently suppress that CI -- GitHub does not trigger workflows on
          # commits made with the default token -- and the R CMD check matrix
          # this project gates merges on would never run.
          claude_args: |
            --model claude-opus-5
            --max-turns 80
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep"

          prompt: |
            You are working this repository's issue queue, unattended, inside a
            GitHub Actions runner. Work EXACTLY ONE issue and then stop. Do not
            start a second one, however easy the next one looks -- one issue per
            run is what keeps a run that dies on quota cheap to redo.

            ## 1. Pick the issue

            This run was triggered by: ${{ github.event_name }}
            Issue named by the trigger (empty if none): ${{ github.event.issue.number || inputs.issue }}

            If that number is non-empty, work that issue. Otherwise choose one:

              a. the oldest open issue labelled `agent-ready` and not labelled
                 `agent-working`; failing that,
              b. a stale claim -- an open issue labelled `agent-working` whose
                 label was applied more than 6 hours ago. A previous run died
                 mid-flight and the claim needs reclaiming. `gh issue view` does
                 not carry label timestamps; read them from the timeline, e.g.
                 `gh api repos/${{ github.repository }}/issues/<N>/timeline
                 --jq '.[] | select(.event=="labeled") | [.created_at,.label.name]'`.

            If neither exists, do nothing at all, comment nothing, and exit
            successfully. An idle queue is the normal state, not a failure.

            ## 2. Claim it

            Before any other work: add `agent-working` and remove `agent-ready`.
            Claiming first is what stops a concurrent run taking the same issue.

            ## 3. Do the work

            Read CLAUDE.md at the repository root FIRST and follow it. It is the
            source of truth for this package's conventions and it documents traps
            that will otherwise cost you the whole run.

            - `git fetch origin`, fast-forward `main`, then cut
              `issue-<N>-<short-slug>` off it. Never commit to `main`.
            - Make the change, kept to the scope the issue actually asks for.
              Do not widen it because you noticed something else nearby.
            - If you touch roxygen comments or exports, run `devtools::document()`.
              Never hand-edit NAMESPACE or man/*.Rd.

            ## 4. Verify -- this gate is not optional

            R, pandoc and the package dependencies are already installed on this
            runner, so just use them:

                R CMD build .
                R CMD check --no-manual <tarball>

            Write the tarball and any check output to a directory OUTSIDE the
            repository, such as $RUNNER_TEMP. `R CMD build` sweeps up untracked
            files sitting at the top level, so a log written into the repo root
            lands in the tarball and earns a "Non-standard file/directory found
            at top level" NOTE.

            Run `devtools::test()` as well.

            The check must come back clean: no ERRORs, no WARNINGs, and no NOTEs
            beyond those CLAUDE.md documents as expected. If you cannot get it
            clean, do NOT open a pull request -- go to section 6.

            ## 5. Ship it

            - Commit, ending the message with `Closes #<N>` and
              `Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>`.
            - Push the branch and open a pull request into `main`.
            - NEVER merge it and never push to `main`. A human reviews every
              change; opening the PR is where your authority ends.
            - Comment on the issue with what changed, the PR link, and anything
              that turned out differently from what the issue assumed. Report
              this faithfully -- if you fixed part of it, say which part. Do not
              present a partial fix as a complete one.
            - Swap the labels: remove `agent-working`, add `agent-done`.

            ## 6. If you get stuck

            Blocked, out of scope, needs a judgement call only a human should
            make, or the check will not come clean: comment on the issue saying
            precisely where you stopped and what you tried, remove
            `agent-working`, add `agent-blocked`, and exit.

            Do NOT restore `agent-ready`. That would send the next scheduled run
            into the same dead end six hours later, and every six hours after
            that. `agent-blocked` is a request for a human to look.
