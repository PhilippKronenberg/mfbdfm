# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

# Two pushes to main a few seconds apart used to start two runs that both built
# the site and both pushed to gh-pages; one lost the race and failed at the
# deploy step (#89). The agent queue makes bursts of merges ordinary, so this
# needs serialising.
#
# Note this deliberately does NOT cancel in progress, where r.yml does. A
# superseded check is worth nothing and is free to kill; a deploy killed partway
# through can leave gh-pages half-updated. GitHub keeps at most one pending run
# per group, so a burst collapses to "current, then newest" rather than a
# backlog. Keying on github.ref leaves pull-request runs independent, which is
# harmless since they never reach the deploy step.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      # Cheap guard for the failure mode in #47: a topic documented and
      # registered but missing from _pkgdown.yml's hand-grouped reference
      # index is invisible to R CMD check, and otherwise only surfaces
      # partway into the full site build below. check_pkgdown() errors on
      # an incomplete index, so a problem here exits non-zero.
      - name: Check pkgdown reference index
        run: pkgdown::check_pkgdown()
        shell: Rscript {0}

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
